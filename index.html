<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PRECEDENT COMPARISON</title>
    <style>
        :root { --accent: #ff6b00; }
        body { margin: 0; font-family: sans-serif; background: #fff; padding: 40px; }
        .wrapper { display: flex; gap: 30px; justify-content: center; }
        .column { flex: 1; max-width: 500px; border: 1px solid #eee; padding: 20px; }
        .img-box { width: 100%; height: 400px; background: #f9f9f9; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; }
        .img-box img { max-width: 95%; max-height: 95%; object-fit: contain; }
        .table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        .table th { background: #000; color: #fff; padding: 10px; text-align: left; text-transform: uppercase; font-size: 9px; }
        .table td { padding: 12px; border-bottom: 1px solid #eee; }
        .label { font-weight: 800; color: var(--accent); width: 30%; font-size: 10px; text-transform: uppercase; }
        h2 { border-bottom: 3px solid #000; padding-bottom: 5px; letter-spacing: -1px; }
    </style>
</head>
<body>

<div id="view">Loading comparison data...</div>

<script src="database.js"></script>
<script>
    window.onload = function() {
        const view = document.getElementById('view');
        
        if (typeof siteData === 'undefined') {
            view.innerHTML = "<h1 style='color:red'>Error: database.js not found in repository.</h1>";
            return;
        }

        view.className = "wrapper";
        view.innerHTML = siteData.map(s => `
            <div class="column">
                <div style="font-size: 10px; font-weight: 900; color: var(--accent);">${s.bucket}</div>
                <h2>${s.name}</h2>
                <div class="img-box">
                    <img src="${s.plan_url}" onerror="this.src='https://placehold.co/600x400?text=Check+Filename'">
                </div>
                <table class="table">
                    <tr><th>Feature</th><th>Detail</th></tr>
                    <tr><td class="label">Logic</td><td>${s.plan_type}</td></tr>
                    <tr><td class="label">End Type</td><td>${s.bucket === 'Cistercian' ? 'Square Apse' : 'Radial Chevet'}</td></tr>
                    <tr><td class="label">Notes</td><td>${s.notes}</td></tr>
                </table>
            </div>
        `).join('');
    };
</script>

</body>
</html>
