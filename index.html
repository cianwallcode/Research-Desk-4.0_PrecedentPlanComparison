<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MONASTERY DATA LABELING</title>
    <style>
        :root { --accent: #ff6b00; }
        body { margin: 0; padding: 40px; font-family: sans-serif; background: #fff; overflow-y: scroll; }
        .wrapper { display: flex; gap: 40px; justify-content: center; }
        .column { flex: 1; max-width: 550px; }
        
        .img-container { position: relative; width: 100%; border: 1px solid #ccc; background: #fdfdfd; }
        .img-container img { width: 100%; display: block; }
        
        /* Interactive SVG Styles */
        .hotspot { fill: rgba(255, 107, 0, 0.1); stroke: var(--accent); stroke-width: 1.5; cursor: help; transition: 0.2s; }
        .hotspot:hover { fill: rgba(255, 107, 0, 0.4); stroke-width: 3; }

        h2 { border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 20px; text-transform: uppercase; }
        .badge { display: inline-block; padding: 3px 8px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; margin-bottom: 5px; }
        footer { margin-top: 60px; text-align: center; font-size: 11px; color: #777; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>

<div id="view" class="wrapper"></div>

<footer>
    &copy; 2026 [Your Name]. All Rights Reserved. | Strictly Proprietary 
</footer>

<script src="database.js"></script>
<script>
    function render() {
        const view = document.getElementById('view');
        if (typeof siteData === 'undefined') return;

        view.innerHTML = siteData.map(s => {
            const labels = Object.values(s.labels); // Gets Church, Cloister, and Refectory
            
            return `
            <div class="column">
                <span class="badge">${s.bucket}</span>
                <h2>${s.name}</h2>
                
                <div class="img-container">
                    <img src="${s.plan_url}">
                    
                    <svg viewBox="0 0 100 100" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                        ${labels.map(l => `
                            <rect x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" class="hotspot">
                                <title>${l.name} | Ratio: ${l.ratio}</title>
                            </rect>
                        `).join('')}
                    </svg>
                </div>
                <p style="font-size: 12px; color: #666; margin-top: 10px;">
                    * Hover over boxes to see architectural proportions.
                </p>
            </div>`;
        }).join('');
    }
    window.onload = render;
</script>

</body>
</html>
