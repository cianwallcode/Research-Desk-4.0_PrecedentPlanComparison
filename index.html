<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PRECEDENT COMPARISON MATRIX</title>
    <style>
        :root { --accent: #ff6b00; }
        body { margin: 0; font-family: sans-serif; background: #fff; }
        
        .comp-wrapper { display: flex; gap: 20px; padding: 40px; justify-content: center; }
        .plan-column { flex: 1; max-width: 600px; border: 1px solid #eee; padding: 20px; }
        
        .plan-image { width: 100%; height: 500px; object-fit: contain; background: #f9f9f9; border: 1px solid #ddd; }
        
        .analysis-table { width: 100%; border-collapse: collapse; margin-top: 30px; font-size: 14px; }
        .analysis-table th { background: #000; color: #fff; padding: 12px; text-align: left; text-transform: uppercase; font-size: 10px; }
        .analysis-table td { padding: 15px; border-bottom: 1px solid #eee; vertical-align: top; }
        .feature-label { font-weight: 800; width: 30%; color: var(--accent); text-transform: uppercase; font-size: 11px; }
        
        h2 { letter-spacing: -1px; border-bottom: 4px solid #000; padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="comp-wrapper" id="comparison-view">
    </div>

<script src="database.js"></script>
<script>
    function renderComparison() {
        const container = document.getElementById('comparison-view');
        
        // Target specifically Mellifont (Cistercian) and Cluny (Benedictine)
        const cistercian = siteData.find(s => s.bucket === "Cistercian");
        const benedictine = siteData.find(s => s.bucket === "Benedictine");

        const pair = [cistercian, benedictine];

        container.innerHTML = pair.map(s => `
            <div class="plan-column">
                <div style="font-size: 10px; font-weight: 900; color: var(--accent);">${s.bucket.toUpperCase()}</div>
                <h2>${s.name}</h2>
                <img src="${s.plan_url}" class="plan-image" onerror="this.src='https://via.placeholder.com/600x500?text=Image+Load+Error'">
                
                <table class="analysis-table">
                    <tr><th>Feature</th><th>Typological Detail</th></tr>
                    <tr><td class="feature-label">Plan Logic</td><td>${s.plan_type}</td></tr>
                    <tr><td class="feature-label">East End</td><td>${s.bucket === 'Cistercian' ? 'Square / Flat' : 'Radial / Chevet'}</td></tr>
                    <tr><td class="feature-label">Aesthetic</td><td>${s.style}</td></tr>
                    <tr><td class="feature-label">Notes</td><td>${s.notes}</td></tr>
                </table>
            </div>
        `).join('');
    }

    window.onload = () => {
        if (typeof siteData !== 'undefined') {
            renderComparison();
        } else {
            document.body.innerHTML = "<h1 style='color:red; padding:40px;'>Error: database.js not found or contains syntax errors.</h1>";
        }
    };
</script>

</body>
</html>
