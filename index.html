<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Precedent Comparison Engine</title>
    <style>
        :root { --accent: #ff6b00; --sidebar-w: 220px; }
        body { margin: 0; font-family: sans-serif; background: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: var(--sidebar-w); background: #f4f4f4; border-right: 2px solid #000; display: flex; flex-direction: column; padding: 20px; z-index: 10; }
        .sidebar h1 { font-size: 14px; letter-spacing: -0.5px; margin-bottom: 30px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        
        .tab-btn { width: 100%; padding: 12px; background: none; border: 1px solid #000; cursor: pointer; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; text-align: left; transition: 0.2s; }
        .tab-btn.active { background: #000; color: #fff; }

        .viewport { flex: 1; overflow-y: auto; background: #fff; }
        .tab-content { padding: 30px; display: none; }
        .tab-content.active { display: flex; flex-wrap: wrap; gap: 30px; }

        /* Existing styles for content */
        .column { flex: 1; min-width: 400px; max-width: 480px; }
        .img-wrap { position: relative; border: 1px solid #ddd; line-height: 0; }
        .img-wrap img { width: 100%; }
    </style>
</head>
<body>

<div class="sidebar">
    <h1>PRECEDENT<br>ENGINE v2.3</h1>
    
    <div class="control-group">
        <span class="control-label">Navigation</span>
        <button id="btn-plan" class="tab-btn active" onclick="switchTab('tab-plan', 'btn-plan')">Plan Tab</button>
        <button id="btn-cloisters" class="tab-btn" onclick="switchTab('tab-cloisters', 'btn-cloisters')">Cloisters & Arcades</button>
    </div>

    <div style="margin-top: auto; font-size: 9px; color: #999;">&copy; 2026 R4. All Rights Reserved.</div>
</div>

<div class="viewport">
    <div id="tab-plan" class="tab-content active" id="view-plan"></div>
    
    <div id="tab-cloisters" class="tab-content">
        <div style="width: 100%; color: #666; font-style: italic;">Cloisters and Arcades archive loading...</div>
    </div>
</div>

<script src="database.js"></script>
<script>
    function switchTab(tabId, btnId) {
        // Hide all tabs
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        // Show selected
        document.getElementById(tabId).classList.add('active');
        document.getElementById(btnId).classList.add('active');
    }

    function renderPlans() {
        const view = document.getElementById('tab-plan');
        if (typeof siteData === 'undefined') return;
        
        view.innerHTML = siteData.map(s => `
            <div class="column">
                <div style="font-size: 9px; font-weight: 900; color: var(--accent);">${s.bucket} PRECEDENT</div>
                <h2 style="margin: 5px 0 15px 0; font-size: 1.4rem;">${s.name}</h2>
                <div class="img-wrap"><img src="${s.plan_url}"></div>
                <div class="synth-card" style="margin-top:15px; font-size:11px;">${s.synthesis}</div>
            </div>`).join('');
    }

    window.onload = renderPlans;
</script>
</body>
</html>
