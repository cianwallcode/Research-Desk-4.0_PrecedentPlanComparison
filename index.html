<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Precedent Comparison Engine</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000' rx='15'/><text x='12' y='75' font-family='Arial Black' font-size='65' font-weight='900' fill='%23ff6b00'>R</text><text x='60' y='75' font-family='Arial Black' font-size='65' font-weight='900' fill='%23fff'>4</text></svg>">
    
    <style>
        :root { --accent: #ff6b00; }
        body { margin: 0; padding: 0; font-family: sans-serif; background: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .header { padding: 15px 40px; border-bottom: 2px solid #000; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .main-view { display: flex; gap: 20px; padding: 20px; flex: 1; overflow-y: auto; justify-content: center; align-items: flex-start; }
        
        .column { flex: 1; max-width: 480px; border: 1px solid #eee; padding: 15px; display: flex; flex-direction: column; }
        .img-wrap { position: relative; width: 100%; background: #f9f9f9; border: 1px solid #ddd; line-height: 0; }
        .img-wrap img { width: 100%; height: auto; max-height: 45vh; object-fit: contain; }

        /* SVG Overlays */
        .hotspot { fill: rgba(255, 107, 0, 0.1); stroke: var(--accent); stroke-width: 1.2; }
        .box-label { fill: var(--accent); font-size: 3px; font-weight: 900; pointer-events: none; text-transform: uppercase; }
        .prop-label { fill: #000; font-size: 2.5px; font-weight: 400; opacity: 0; transition: opacity 0.3s; }
        
        /* Toggle Logic */
        .show-props .prop-label { opacity: 1; }

        /* UI Elements */
        .synth-card { background: #000; color: #fff; padding: 12px; margin-top: 10px; font-size: 11px; border-left: 4px solid var(--accent); }
        .toggle-btn { padding: 8px 16px; background: #eee; border: none; cursor: pointer; font-size: 10px; font-weight: 800; text-transform: uppercase; transition: 0.2s; }
        .toggle-btn.active { background: var(--accent); color: #fff; }
        
        footer { padding: 15px; text-align: center; font-size: 10px; color: #999; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="header">
    <strong style="letter-spacing: -0.5px;">PRECEDENT COMPARISON ENGINE</strong>
    <div>
        <button id="propToggle" class="toggle-btn" onclick="toggleProps()">Proportion Analysis: OFF</button>
    </div>
</div>

<div id="view" class="main-view"></div>

<footer>
    &copy; 2026 [Your Name]. All Rights Reserved.
</footer>

<script src="database.js"></script>
<script>
    let propsActive = false;

    function toggleProps() {
        propsActive = !propsActive;
        const btn = document.getElementById('propToggle');
        const view = document.getElementById('view');
        
        btn.innerText = `Proportion Analysis: ${propsActive ? 'ON' : 'OFF'}`;
        btn.classList.toggle('active', propsActive);
        view.classList.toggle('show-props', propsActive);
    }

    function render() {
        const view = document.getElementById('view');
        if (typeof siteData === 'undefined') return;

        view.innerHTML = siteData.map(s => `
            <div class="column">
                <div style="font-size: 9px; font-weight: 900; color: var(--accent);">${s.bucket} PRECEDENT</div>
                <h2 style="margin: 5px 0 15px 0; font-size: 1.3rem;">${s.name}</h2>
                
                <div class="img-wrap">
                    <img src="${s.plan_url}">
                    <svg viewBox="0 0 100 100" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                        ${s.labels.map(l => `
                            <g>
                                <rect x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" class="hotspot"></rect>
                                <text x="${l.x + 1}" y="${l.y + 4}" class="box-label">${l.name}</text>
                                <text x="${l.x + 1}" y="${l.y + 8}" class="prop-label">${l.prop}</text>
                            </g>
                        `).join('')}
                    </svg>
                </div>
                <div class="synth-card"><strong>ANALYSIS:</strong><br>${s.synthesis}</div>
            </div>`).join('');
    }
    window.onload = render;
</script>
</body>
</html>
