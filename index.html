<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MONASTERY DATA LABELING</title>
    <style>
        :root { --accent: #ff6b00; }
        body { margin: 0; padding: 20px; font-family: 'Helvetica', sans-serif; background: #f4f4f4; }
        
        .wrapper { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        
        /* Shrunk the columns so they fit better */
        .column { 
            flex: 1; min-width: 400px; max-width: 500px; 
            background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .img-container { position: relative; width: 100%; border: 1px solid #ddd; }
        .img-container img { width: 100%; display: block; }
        
        /* Hotspot & Text Styles */
        .hotspot { fill: rgba(255, 107, 0, 0.1); stroke: var(--accent); stroke-width: 1.5; }
        .label-text { fill: var(--accent); font-size: 3px; font-weight: bold; pointer-events: none; text-transform: uppercase; }

        h2 { margin: 10px 0; font-size: 1.2rem; border-bottom: 2px solid #333; padding-bottom: 5px; }
        .type-tag { font-size: 10px; font-weight: 800; color: var(--accent); }
    </style>
</head>
<body>

<div id="view" class="wrapper"></div>

<script src="database.js"></script>
<script>
    function render() {
        const view = document.getElementById('view');
        if (typeof siteData === 'undefined') return;

        view.innerHTML = siteData.map(s => `
            <div class="column">
                <div class="type-tag">${s.bucket}</div>
                <h2>${s.name}</h2>
                
                <div class="img-container">
                    <img src="${s.plan_url}">
                    
                    <svg viewBox="0 0 100 100" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                        ${s.labels.map(l => `
                            <g>
                                <rect x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" class="hotspot">
                                    <title>Ratio: ${l.ratio}</title>
                                </rect>
                                <text x="${l.x + 1}" y="${l.y + l.h - 1}" class="label-text">${l.name}</text>
                            </g>
                        `).join('')}
                    </svg>
                </div>
            </div>`).join('');
    }
    window.onload = render;
</script>

</body>
</html>
