<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monastic Synthesis Tool</title>
    <style>
        :root { --accent: #ff6b00; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #fff; overflow-y: scroll; }
        
        /* Layout */
        .dashboard { display: flex; flex-direction: column; height: 100vh; }
        .header { padding: 15px 40px; border-bottom: 2px solid #000; display: flex; justify-content: space-between; }
        
        .main-view { display: flex; gap: 20px; padding: 20px; flex: 1; min-height: 0; }
        .column { flex: 1; display: flex; flex-direction: column; min-height: 0; border: 1px solid #eee; padding: 10px; }
        
        /* Smaller Images */
        .img-wrap { position: relative; flex: 1; background: #f9f9f9; min-height: 0; display: flex; justify-content: center; }
        .img-wrap img { max-height: 45vh; width: auto; object-fit: contain; }

        /* Interactive Labels */
        .hotspot { fill: rgba(255,107,0,0.05); stroke: var(--accent); stroke-width: 1.2; cursor: crosshair; transition: 0.2s; }
        .hotspot:hover { fill: rgba(255,107,0,0.4); stroke-width: 3; }
        .box-label { fill: var(--accent); font-size: 3px; font-weight: 900; pointer-events: none; opacity: 0; transition: 0.3s; }
        .img-wrap:hover .box-label { opacity: 1; }

        .synth-card { background: #000; color: #fff; padding: 15px; margin-top: 10px; font-size: 12px; height: 60px; overflow: hidden; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <strong>ARCHITECTURAL SYNTHESIS ENGINE (v2.0)</strong>
        <span style="font-size: 11px;">&copy; 2026 [YOUR NAME]</span>
    </div>

    <div id="view" class="main-view"></div>
</div>

<script src="database.js"></script>
<script>
    function render() {
        const view = document.getElementById('view');
        if (!window.siteData) return;

        view.innerHTML = siteData.map(s => `
            <div class="column">
                <h3 style="margin: 0; font-size: 14px; color: var(--accent);">${s.bucket}</h3>
                <h2 style="margin: 0 0 10px 0;">${s.name}</h2>
                
                <div class="img-wrap">
                    <img src="${s.plan_url}">
                    <svg viewBox="0 0 100 100" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; preserveAspectRatio: xMidYMid meet;">
                        ${s.labels.map(l => `
                            <g>
                                <rect x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" class="hotspot">
                                    <title>${l.name}: ${l.ratio}</title>
                                </rect>
                                <text x="${l.x + 0.5}" y="${l.y + 3}" class="box-label">${l.name}</text>
                            </g>
                        `).join('')}
                    </svg>
                </div>
                <div class="synth-card"><strong>DIFFERENCE:</strong><br>${s.synthesis}</div>
            </div>`).join('');
    }
    window.onload = render;
</script>
</body>
</html>
